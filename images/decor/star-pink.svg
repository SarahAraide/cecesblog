<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- glossy pink: light at the top, hot pink at the bottom -->
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD1E6"/>
      <stop offset="0.5" stop-color="#FF7DC0"/>
      <stop offset="1" stop-color="#FF2E93"/>
    </linearGradient>
  </defs>
  <!-- chunky five-point star with a white sticker edge (same shape as star.svg) -->
  <path d="M32 4 L39.4 22.9 L59.6 24 L43.9 36.9 L49 56.5 L32 45.5 L15 56.5 L20.1 36.9 L4.4 24 L24.6 22.9 Z"
        fill="url(#pink)" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
  <!-- shine -->
  <ellipse cx="26" cy="26" rx="4" ry="2.4" fill="#FFFFFF" opacity="0.8" transform="rotate(-30 26 26)"/>
</svg>
