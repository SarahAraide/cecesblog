<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- CECE ladybug: seen from above, head pointing UP.
       (main.js relies on "head up" when it turns the wandering ladybug.) -->

  <!-- legs (drawn first so the body covers their inner ends) -->
  <path d="M15 30 L6 25 M14 40 L5 42 M17 50 L9 57 M49 30 L58 25 M50 40 L59 42 M47 50 L55 57"
        stroke="#111111" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- antennae -->
  <path d="M28 11 Q25 4 19 3 M36 11 Q39 4 45 3"
        stroke="#111111" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- head, with a white "sticker" edge so it shows on dark backgrounds too -->
  <circle cx="32" cy="17" r="9" fill="#111111" stroke="#FFFFFF" stroke-width="2"/>

  <!-- red shell -->
  <ellipse cx="32" cy="38" rx="19" ry="21" fill="#D7261E" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- the line where the two wings meet -->
  <path d="M32 18 V58" stroke="#111111" stroke-width="2"/>

  <!-- spots -->
  <g fill="#111111">
    <circle cx="24" cy="31" r="4"/>
    <circle cx="40" cy="31" r="4"/>
    <circle cx="21" cy="42" r="3.5"/>
    <circle cx="43" cy="42" r="3.5"/>
    <circle cx="26" cy="51" r="3"/>
    <circle cx="38" cy="51" r="3"/>
  </g>

  <!-- glossy shine -->
  <ellipse cx="23" cy="23.5" rx="3.5" ry="1.8" fill="#FFFFFF" opacity="0.65" transform="rotate(-30 23 23.5)"/>

  <!-- eyes -->
  <circle cx="28.5" cy="14.5" r="1.6" fill="#FFFFFF"/>
  <circle cx="35.5" cy="14.5" r="1.6" fill="#FFFFFF"/>
</svg>
