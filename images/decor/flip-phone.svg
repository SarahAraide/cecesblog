<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- open Y2K flip phone -->
  <g stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round">
    <rect x="41" y="1.5" width="5" height="10" rx="2.5" fill="#C9CDD6"/>   <!-- antenna -->
    <rect x="18" y="6" width="28" height="25" rx="6" fill="#FF2E93"/>      <!-- top half (screen side) -->
    <rect x="18" y="34" width="28" height="27" rx="6" fill="#FF2E93"/>     <!-- bottom half (keypad side) -->
    <rect x="21" y="29" width="22" height="7" rx="3" fill="#C9CDD6"/>      <!-- chrome hinge -->
  </g>
  <!-- screen with a tiny heart "new message" -->
  <rect x="22" y="10" width="20" height="16" rx="2.5" fill="#DDF6FF"/>
  <path d="M32 22 C27 18.5 26 16 27.5 14.5 C29 13 31 13.6 32 15.2 C33 13.6 35 13 36.5 14.5 C38 16 37 18.5 32 22 Z" fill="#FF2E93"/>
  <!-- keypad buttons -->
  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="25" cy="41" r="2.2"/><circle cx="32" cy="41" r="2.2"/><circle cx="39" cy="41" r="2.2"/>
    <circle cx="25" cy="47" r="2.2"/><circle cx="32" cy="47" r="2.2"/><circle cx="39" cy="47" r="2.2"/>
    <circle cx="25" cy="53" r="2.2"/><circle cx="32" cy="53" r="2.2"/><circle cx="39" cy="53" r="2.2"/>
  </g>
</svg>
