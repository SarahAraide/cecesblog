<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- rainbow-ish "holographic" shine of a CD -->
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F6F9"/>
      <stop offset="0.3" stop-color="#FF9EE6"/>
      <stop offset="0.5" stop-color="#B9A8FF"/>
      <stop offset="0.7" stop-color="#9EF0FF"/>
      <stop offset="1" stop-color="#F5F6F9"/>
    </linearGradient>
    <!-- a mask punches the hole: white = keep, black = cut out -->
    <mask id="hole">
      <rect width="64" height="64" fill="#FFFFFF"/>
      <circle cx="32" cy="32" r="5" fill="#000000"/>
    </mask>
  </defs>
  <g mask="url(#hole)">
    <circle cx="32" cy="32" r="28" fill="url(#holo)" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="32" cy="32" r="11" fill="#E9EBF0" stroke="#FF2E93" stroke-width="1.5"/>
    <!-- light streaks -->
    <path d="M13 22 A21 21 0 0 1 22 12.5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M51 42 A21 21 0 0 1 42 51.5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
  </g>
  <circle cx="32" cy="32" r="29.5" fill="none" stroke="#FF2E93" stroke-width="1.2"/>
  <circle cx="32" cy="32" r="5" fill="none" stroke="#FF2E93" stroke-width="1.5"/>
</svg>
